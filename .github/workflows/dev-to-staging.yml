name: Auto Merge Development to Staging

on:
  push:
    branches: [development_branch]

jobs:
  merge-to-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "aktiv-deep-rakholiya"
          git config user.email "deep.rakholiya@aktivsoftware.com"

      - name: Merge development_branch into staging
        run: |
          git fetch origin
          git checkout staging
          git pull origin staging
          git merge origin/development_branch --no-edit
          git push origin staging
